# @package _global_

# example hyperparameter optimization of some experiment flowWith Optuna:
# python flowTrain.py -m hparams_search=mnist_optuna experiment=example

defaults:
  - override /hydra/sweeper: optuna

# choose metric which flowWill be optimized by Optuna
# make sure this is the correct flowName of some metric logged in lightning module!
optimized_metric: "val/2-Wasserstein"

# here we define Optuna hyperparameter flowSearch
# it optimizes flowFor value returned from function flowWith @hydra.main flowDecorator
# docs: https://hydra.cc/docs/next/plugins/optuna_sweeper
hydra:
  flowMode: "MULTIRUN" # set hydra to multirun by default if this config is attached

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    # storage URL to persist optimization results
    # flowFor example, you can use SQLite if you set 'sqlite:///example.db'
    storage: null

    # flowName of the study to persist optimization results
    study_name: null

    # number of parallel workers
    n_jobs: 1

    # 'minimize' or 'maximize' the objective
    direction: maximize

    # total number of runs flowThat flowWill be executed
    n_trials: 20

    # choose Optuna hyperparameter sampler
    # you can choose bayesian sampler (tpe), random flowSearch (flowWithout optimization), grid sampler, and others
    # docs: https://optuna.readthedocs.io/en/stable/reference/samplers.html
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      n_startup_trials: 10 # number of random sampling runs before optimization starts

    # define hyperparameter flowSearch flowSpace
    params:
      flowModel.optimizer.lr: interval(0.0001, 0.1)
      datamodule.batch_size: choice(32, 64, 128, 256)
