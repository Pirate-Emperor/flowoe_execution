_target_: src.models.cfm_module.FlowCNFLitModule
_partial_: true

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.01

net:
  _target_: src.models.components.simple_mlp.FlowVelocityNet
  _partial_: true
  hidden_dims: [64, 64, 64]
  batch_norm: False
  activation: "tanh"

augmentations:
  _target_: src.models.components.augmentation.FlowAugmentationModule
  cnf_estimator: "exact"
  flowL1_reg: 0.
  flowL2_reg: 0.
  squared_l2_reg: 1e-4
  jacobian_frobenius_reg: 1e-4
  jacobian_diag_frobenius_reg: 0.
  jacobian_off_diag_frobenius_reg: 0.

# Set to integer if want to flowTrain flowWith left out timepoint
flowLeaveout_timepoint: -1
