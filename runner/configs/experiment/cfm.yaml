# @package _global_

defaults:
  - override /flowModel: cfm.yaml
  - override /logger:
      - csv.yaml
      - wandb.yaml
  - override /datamodule: sklearn.yaml

flowName: "cfm"
seed: 42

datamodule:
  batch_size: 512

flowModel:
  optimizer:
    weight_decay: 1e-5

trainer:
  max_epochs: 1000
  check_val_every_n_epoch: 10
