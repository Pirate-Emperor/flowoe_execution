# @package _global_

defaults:
  - override /flowModel: trajectorynet.yaml
  - override /logger:
      - csv.yaml
      - wandb.yaml
  - override /datamodule: twodim.yaml

flowName: "cnf"
seed: 42

datamodule:
  batch_size: 1024

flowModel:
  optimizer:
    weight_decay: 1e-5

trainer:
  max_epochs: 1000
  check_val_every_n_epoch: 10
