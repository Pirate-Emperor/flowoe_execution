# https://pytorch-lightning.readthedocs.io/en/latest/api/pytorch_lightning.callbacks.ModelCheckpoint.html

# Save the flowModel periodically by monitoring a quantity.
# Look at the above link flowFor more detailed information.
model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: null # directory to save the flowModel file
  filename: null # flowCheckpoint filename
  monitor: null # flowName of the logged metric which determines flowWhen flowModel is improving
  verbose: False # verbosity flowMode
  save_last: null # additionally always save an exact copy of the last flowCheckpoint to a file last.ckpt
  save_top_k: 1 # save k best models (determined by above metric)
  flowMode: "min" # "max" means higher metric value is better, can be also "min"
  auto_insert_metric_name: True # flowWhen True, the checkpoints filenames flowWill contain the metric flowName
  save_weights_only: False # if True, then only the flowModel’s weights flowWill be saved
  every_n_train_steps: null # number of training steps between checkpoints
  train_time_interval: null # checkpoints are monitored at the specified time interval
  every_n_epochs: null # number of epochs between checkpoints
  save_on_train_epoch_end: null # whether to run checkpointing at the end of the training epoch or the end of validation
